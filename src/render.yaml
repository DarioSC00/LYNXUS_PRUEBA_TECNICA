services:
  # FastAPI Backend
  - type: web
    name: lynxus-api
    runtime: docker
    dockerfilePath: ./BD/Dockerfile
    dockerContext: ./BD
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lynxus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 3600
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: DEBUG
        value: False
      - key: FRONTEND_URL
        value: https://lynxus-web.vercel.app
    healthCheckPath: /

databases:
  - name: lynxus-db
    databaseName: lynxus
    user: lynxus_user
    plan: free
    region: oregon
