services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: lynxus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lynxus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./BD
      dockerfile: Dockerfile
    container_name: lynxus_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tasks_db
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 3600
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lynxus_network
    volumes:
      - ./BD:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Next.js Frontend
  web:
    build:
      context: ./Front/apps/web
      dockerfile: Dockerfile
    container_name: lynxus_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    networks:
      - lynxus_network

  # PgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lynxus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ruben.salazar@lynxus.biz
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - lynxus_network

networks:
  lynxus_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local